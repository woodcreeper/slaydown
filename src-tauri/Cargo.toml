[package]
name = "slaydown"
version = "0.3.1"
description = "A quiet, lightweight Markdown reader"
authors = ["David La Puma"]
license = "MIT"
repository = "https://github.com/woodcreeper/slaydown"
edition = "2021"
rust-version = "1.88"

[lib]
name = "slaydown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
percent-encoding = "2"
url = "2"
serde_json = "1"
notify = "8.2"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
