name: Arch package and Wayland check
on:
  workflow_call:
    inputs:
      build_run_id:
        required: true
        type: string
      sushi_only:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful Build and release run containing the SlayDown-Linux artifact'
        required: true
        type: string
      sushi_only:
        description: 'Only test the Sushi adapter against the selected build; skip Arch packaging'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  arch:
    if: ${{ !inputs.sushi_only }}
    name: Arch package and Wayland startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SlayDown-Linux
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
      - name: Allow nested sandbox namespaces in this disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build, install, and launch native Arch package
        timeout-minutes: 15
        shell: bash
        run: |
          docker run --rm -i \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -e BUILDER_UID="$(id -u)" -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            archlinux:base-devel bash -euo pipefail -s <<'ARCH'
          pacman -Syu --noconfirm --needed nodejs webkit2gtk-4.1 gtk3 openssl xdotool librsvg hicolor-icon-theme desktop-file-utils weston dbus ttf-dejavu
          useradd --uid "$BUILDER_UID" --create-home builder
          chown -R builder:builder /workspace
          # Verify nested sandboxes explicitly; do not disable app/image sandboxing.
          runuser -u builder -- bwrap --unshare-all --ro-bind / / --dev /dev /usr/bin/true
          deb=$(find artifacts -name '*.deb' -print -quit)
          test -n "$deb"
          runuser -u builder -- bash scripts/package-arch.sh "$deb"
          pacman -U --noconfirm release-assets/*.pkg.tar.zst
          test "$(slaydown --preview-version)" = "$(node -p 'require("./package.json").version')"
          ldd /usr/bin/slaydown | tee /tmp/slaydown-libraries.txt
          ! grep -q 'not found' /tmp/slaydown-libraries.txt
          desktop=$(pacman -Qlq slaydown-markdown | grep '\.desktop$' | head -1)
          desktop-file-validate "$desktop"
          runuser -u builder -- dbus-run-session -- bash scripts/smoke-wayland.sh
          ARCH
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SlayDown-Arch
          path: release-assets/*.pkg.tar.zst
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: arch-wayland-diagnostics
          path: test-results/arch-wayland.log
  sushi:
    if: ${{ inputs.sushi_only }}
    uses: ./.github/workflows/sushi-check.yml
    with:
      build_run_id: ${{ inputs.build_run_id }}
