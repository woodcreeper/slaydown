name: Sushi runtime check
on:
  workflow_call:
    inputs:
      build_run_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  sushi:
    name: Render Markdown in Sushi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: SlayDown-Linux
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
      - name: Install reader and preview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-sushi gjs gir1.2-webkit2-4.1 xvfb dbus-x11 ripgrep scrot xauth desktop-file-utils
          deb=$(find artifacts -name '*.deb' -print -quit)
          test -n "$deb"
          sudo apt-get install -y "./$deb"
          mkdir -p src-tauri/target/release
          ln -s /usr/bin/slaydown src-tauri/target/release/slaydown
          mkdir -p build
          adapter=$(find artifacts -name 'SlayDown-Sushi.tar.gz' -print -quit)
          test -n "$adapter"
          tar -xzf "$adapter" -C build
      - name: Assemble adapters from the revision being tested
        run: node scripts/build-linux-preview.mjs
      - name: Allow WebKit sandbox namespaces in this disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify Markdown default repair and exact filename forwarding
        run: dbus-run-session -- python3 scripts/test-linux-desktop.py
      - name: Verify automatic install and upgrade lifecycle
        run: SLAYDOWN_EXPECT_SUSHI=1 dbus-run-session -- node scripts/test-linux-lifecycle.mjs /usr/bin/slaydown
      - name: Render Markdown through the actual Sushi host
        run: xvfb-run -a -s "-screen 0 1600x1200x24" dbus-run-session -- bash scripts/test-sushi.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: SlayDown-Sushi-diagnostics
          path: test-results/sushi.*
