name: Build and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish a preview release after all builds pass (for example 0.1.0); leave empty to build only'
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macOS
            args: --target universal-apple-darwin --bundles app
          - os: windows-latest
            platform: Windows
            args: --bundles nsis
          - os: ubuntu-22.04
            platform: Linux
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Install both Mac Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm test
      - run: node --test scripts/prepare-release.test.mjs
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Browser interaction tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npx playwright install --with-deps chrome
          npm run dev > /tmp/folio-vite.log 2>&1 &
          trap 'kill $!' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:1420 > /dev/null; then break; fi
            sleep 1
          done
          npm run test:ui
      - name: Build Windows Space-bar adapter
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows-preview.ps1
      - name: Package Linux Space-bar adapter
        if: runner.os == 'Linux'
        run: |
          node scripts/build-linux-preview.mjs
          mkdir -p release-assets
          tar -czf release-assets/SlayDown-Sushi.tar.gz -C build SlayDown-Sushi
      - name: Build packages
        run: npm run desktop:build -- ${{ matrix.args }}
        env:
          NO_STRIP: 'true'
      - name: Test installed native preview CLI
        if: runner.os != 'macOS'
        shell: bash
        run: node scripts/test-preview-cli.mjs src-tauri/target/release/slaydown${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Package universal Mac app
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          codesign --verify --deep --strict src-tauri/target/universal-apple-darwin/release/bundle/macos/SlayDown.app
          ditto -c -k --sequesterRsrc --keepParent src-tauri/target/universal-apple-darwin/release/bundle/macos/SlayDown.app release-assets/SlayDown-macOS-universal.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SlayDown-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release-assets/*.zip
            release-assets/*.qlplugin
            release-assets/*.tar.gz
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
  sushi:
    name: Sushi Space-bar integration
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/sushi-check.yml
    with:
      build_run_id: ${{ github.run_id }}
  arch:
    name: Arch package
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/arch-preview.yml
    with:
      build_run_id: ${{ github.run_id }}
  release:
    needs: [build, sushi, arch]
    if: github.event_name == 'workflow_dispatch' && inputs.version != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: SlayDown-*
          path: artifacts
          merge-multiple: true
      - name: Validate version and collect packages
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/prepare-release.mjs
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" release-assets/* --target "$GITHUB_SHA" --title "SlayDown $RELEASE_VERSION — Preview" --prerelease --notes-file docs/RELEASE_NOTES.md
